name: dukani_app
description: "Dukani POS - Premium merchant mobile app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Fonts & UI
  google_fonts: ^6.3.3
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Device / native features (used by POS + auth screens later)
  local_auth: ^2.3.0
  pin_code_fields: ^8.0.1
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

  # Offline-first data layer
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # Cloud backend (real accounts + central data store)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.4

  # Hosted checkout page for card/wallet payments — see gateway_checkout_screen.dart
  webview_flutter: ^4.9.0

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  csv: ^6.0.0
  lucide_icons_flutter: ^3.1.15
  pdf: ^3.13.0
  printing: ^5.15.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.2
  barcode: ^2.2.9
  image: ^4.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

# Generates the real Dukani logo as the app icon. Run after any
# `flutter create --platforms=...` regenerates a native project folder:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
